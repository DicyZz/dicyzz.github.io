name: Job Requirement Analysis Daily Run

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面手动点击触发，可输入目标城市与岗位
  workflow_dispatch:
    inputs:
      target_city:
        description: '目标城市（如：北京、上海、深圳、杭州、广州）'
        required: false
        default: '北京'
      target_job:
        description: '目标岗位关键词（如：ESL建模工程师、后端开发工程师）'
        required: false
        default: 'ESL建模工程师'

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. 明确写上 playwright 及其它依赖
          pip install requests markdown premailer openai playwright feedparser
          # 2. 安装 Playwright 所需的 Chromium 驱动
          python -m playwright install chromium

      - name: Run Job Analysis Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          BOSS_COOKIES: ${{ secrets.BOSS_COOKIES }}
          MAX_JOBS: '30'
          TARGET_CITY: ${{ github.event.inputs.target_city || '北京' }}
          TARGET_JOB: ${{ github.event.inputs.target_job || 'ESL建模工程师' }}
        run: |
          python scripts/perfpulse_job_analysis.py

      - name: Upload Job Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            jobs_result.json
            jobs_result.md
          if-no-files-found: ignore
