name: Job Monitor - 招聘信息实时抓取

# 手机一键抓取：GitHub App → Actions → 本 workflow → Run workflow → 直接点 Run。
# 工作机（self-hosted runner，国内 IP）负责抓 BOSS 直聘等其他数据源，
# 跑完发邮件，并把 jobs_result.json/md 上传成 artifact。
# 首次部署 / 换机器：bash scripts/setup_macmini_runner.sh
on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_job:
        description: '岗位关键词（如：芯片设计）'
        required: false
        default: '芯片设计'
      target_city:
        description: '城市（填「全国」则不筛选）'
        required: false
        default: '全国'
      source:
        description: '抓取平台'
        required: false
        default: '全部'
        type: choice
        options:
          - '全部'
          - '仅 BOSS 直聘'
          - '仅 猎聘'
          - 'BOSS + 猎聘'
          - 'BOSS + 猎聘 + 智联 + 51job'
          - '国内平台（不含海外远程岗）'
          - '仅 海外远程岗'
      pages:
        description: '每个关键词的翻页数（1-10）'
        required: false
        default: '2'
      keywords:
        description: '使用前几个扩展关键词（0 = 全部，默认）'
        required: false
        default: '0'
      target_industry:
        description: '行业'
        required: false
        default: '不限'
        type: choice
        options:
          - '不限'
          - '互联网/软件/IT'
          - '半导体/电子/芯片'
          - '人工智能'
          - '金融'
          - '医疗健康'
          - '汽车/新能源'
          - '教育/培训'
          - '游戏'
          - '制造业'
          - '通信'
          - '电商/零售/消费'
          - '企业服务'
          - '广告/营销/传媒'

# 定时任务与手动触发不重叠（并发请求更容易触发 BOSS 风控）
concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  analyze-jobs:
    # 固定跑在工作机上：国内 IP 是抓 BOSS 直聘的前提
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Python Interpreter
        # runner 由 launchd 启动，PATH 很干净，所以按固定顺序找一个「依赖齐全」的解释器。
        # 注意：变量后面紧跟中文标点时必须写 ${VAR}——macOS 的 bash 3.2 在 UTF-8
        # locale 下会把标点吃进变量名，直接报 unbound variable（已加单测守卫）。
        run: |
          set -euo pipefail
          PY=""
          DEPS="0"
          for candidate in /opt/homebrew/bin/python3 /usr/local/bin/python3 python3 python; do
            if ! command -v "${candidate}" >/dev/null 2>&1; then
              continue
            fi
            found="$(command -v "${candidate}")"
            if [ -z "${PY}" ]; then
              PY="${found}"
            fi
            if "${found}" -c "import requests, markdown, premailer, openai, lxml, playwright" 2>/dev/null; then
              PY="${found}"
              DEPS="1"
              break
            fi
          done
          if [ -z "${PY}" ]; then
            echo "::error::没找到 python3，请先在工作机上运行 bash scripts/setup_macmini_runner.sh"
            exit 1
          fi
          echo "PYTHON_BIN=${PY}" >> "${GITHUB_ENV}"
          echo "DEPS_READY=${DEPS}" >> "${GITHUB_ENV}"
          echo "Python 解释器: ${PY}"
          "${PY}" -V
          if [ "${DEPS}" = "1" ]; then
            echo "依赖已就绪，跳过安装步骤"
          else
            echo "依赖不完整，接下来会自动安装"
          fi

      - name: Check BOSS Login State
        run: |
          PROFILE="${HOME}/boss_chrome_profile"
          if [ -d "${PROFILE}" ]; then
            echo "找到 BOSS 登录 profile: ${PROFILE}"
          else
            echo "::warning::未找到 ${PROFILE}, 本次会跳过 BOSS 直聘; 请在工作机上运行 python3 scripts/boss_login.py 扫码登录"
          fi

      - name: Resolve Sources
        # 平台选项 -> SOURCES 环境变量（逗号分隔的数据源 key）
        env:
          SOURCE_LABEL: ${{ github.event.inputs.source || '全部' }}
        run: |
          set -euo pipefail
          LABEL="${SOURCE_LABEL:-全部}"
          case "${LABEL}" in
            '仅 BOSS 直聘')               SOURCES_VALUE="boss" ;;
            '仅 猎聘')                    SOURCES_VALUE="liepin" ;;
            'BOSS + 猎聘')                SOURCES_VALUE="boss,liepin" ;;
            'BOSS + 猎聘 + 智联 + 51job') SOURCES_VALUE="boss,liepin,zhilian,job51" ;;
            '国内平台（不含海外远程岗）')   SOURCES_VALUE="boss,liepin,zhilian,job51,nowcoder" ;;
            '仅 海外远程岗')              SOURCES_VALUE="remoteok,wwr,remotive" ;;
            *)                            SOURCES_VALUE="all" ;;
          esac
          echo "抓取平台: ${LABEL} -> ${SOURCES_VALUE}"
          echo "SOURCES=${SOURCES_VALUE}" >> "${GITHUB_ENV}"

      - name: Install Dependencies
        if: env.DEPS_READY != '1'
        run: |
          "${PYTHON_BIN}" -m pip install --upgrade pip || true
          "${PYTHON_BIN}" -m pip install --user requests markdown premailer openai playwright lxml pyyaml \
            || "${PYTHON_BIN}" -m pip install --break-system-packages requests markdown premailer openai playwright lxml pyyaml
          if [ "$(uname)" = "Linux" ]; then
            "${PYTHON_BIN}" -m playwright install --with-deps chromium
          else
            "${PYTHON_BIN}" -m playwright install chromium
          fi

      - name: Run Unit Tests
        run: |
          # 同时写一份到工作目录：失败时可以直接在 runner 机器上看到完整输出
          set -o pipefail
          "${PYTHON_BIN}" -m unittest discover -s tests -v 2>&1 | tee unit-tests.log

      - name: Run Job Analysis Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          BOSS_COOKIES: ${{ secrets.BOSS_COOKIES }}
          BOSS_PROXY: ${{ secrets.BOSS_PROXY }}
          BOSS_PROFILE_DIR: ${{ secrets.BOSS_PROFILE_DIR || '' }}
          # BOSS 专属参数（平台选择、翻页数、关键词个数见上面 Resolve Sources 与 PAGES/KEYWORD_LIMIT）
          BOSS_HEADFUL: '1'
          BOSS_MAX_DETAIL: '0'
          BOSS_DEBUG_DIR: boss_debug
          PAGES: ${{ github.event.inputs.pages || '2' }}
          KEYWORD_LIMIT: ${{ github.event.inputs.keywords || '0' }}
          TARGET_JOB: ${{ github.event.inputs.target_job || '芯片设计' }}
          TARGET_CITY: ${{ github.event.inputs.target_city || '全国' }}
          TARGET_INDUSTRY: ${{ github.event.inputs.target_industry || '不限' }}
        run: |
          set -o pipefail
          echo "== 本次运行配置 =="
          echo "解释器: ${PYTHON_BIN}"
          echo "平台: ${SOURCES} | 翻页数: ${PAGES} | 关键词个数: ${KEYWORD_LIMIT}"
          echo "岗位: ${TARGET_JOB} | 城市: ${TARGET_CITY} | 行业: ${TARGET_INDUSTRY}"
          echo "=================="
          "${PYTHON_BIN}" scripts/perfpulse_job_analysis.py 2>&1 | tee analysis.log

      - name: Upload Job Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            jobs_result.json
            jobs_result.md
            unit-tests.log
            analysis.log
            boss_debug/
          if-no-files-found: ignore
