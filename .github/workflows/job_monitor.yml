name: Job Monitor - 招聘信息实时抓取

# BOSS 直聘需要「国内 IP + 登录态」：把 runner 输入填成 self-hosted（国内 Mac mini），
# 并确保该机器已运行 scripts/setup_macmini_runner.sh + scripts/boss_login.py。
on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面手动点击触发，可输入目标城市与岗位
  workflow_dispatch:
    inputs:
      target_city:
        description: '目标城市（如：北京、上海、深圳、杭州、广州；填「全国」则不筛选）'
        required: false
        default: '全国'
      target_job:
        description: '目标岗位关键词（如：芯片设计、算法工程师、建模；会自动扩展同义词）'
        required: false
        default: '芯片设计'
      max_pages:
        description: '猎聘抓取页数（1-10，默认3，每页约40条）'
        required: false
        default: '3'
      boss_pages:
        description: 'BOSS 直聘翻页数（1-10，默认1；页数越多越容易触发风控）'
        required: false
        default: '1'
      boss_keywords:
        description: 'BOSS 直聘搜索的关键词个数（默认1，填2-3可扩大覆盖但请求更多）'
        required: false
        default: '1'
      boss_detail:
        description: 'BOSS 直聘抓取详情正文的岗位数（默认0关闭，建议不超过5）'
        required: false
        default: '0'
      runner:
        description: '执行环境标签（默认 ubuntu-latest；填国内 self-hosted runner 标签可抓 BOSS，如 self-hosted）'
        required: false
        default: 'ubuntu-latest'
      target_industry:
        description: '目标行业（默认不限）'
        required: false
        default: '不限'
        type: choice
        options:
          - '不限'
          - '互联网/软件/IT'
          - '半导体/电子/芯片'
          - '人工智能'
          - '金融'
          - '医疗健康'
          - '汽车/新能源'
          - '教育/培训'
          - '游戏'
          - '制造业'
          - '通信'
          - '电商/零售/消费'
          - '企业服务'
          - '广告/营销/传媒'

jobs:
  analyze-jobs:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown premailer openai playwright lxml
          if [ "$(uname)" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Run Job Analysis Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          BOSS_COOKIES: ${{ secrets.BOSS_COOKIES }}
          BOSS_PROXY: ${{ secrets.BOSS_PROXY }}
          BOSS_PROFILE_DIR: ${{ secrets.BOSS_PROFILE_DIR || '' }}
          BOSS_HEADFUL: ${{ secrets.BOSS_HEADFUL || '1' }}
          BOSS_PAGES: ${{ github.event.inputs.boss_pages || '1' }}
          BOSS_KEYWORDS_COUNT: ${{ github.event.inputs.boss_keywords || '1' }}
          BOSS_MAX_DETAIL: ${{ github.event.inputs.boss_detail || '0' }}
          BOSS_DEBUG_DIR: boss_debug
          TARGET_CITY: ${{ github.event.inputs.target_city || '全国' }}
          TARGET_JOB: ${{ github.event.inputs.target_job || '芯片设计' }}
          TARGET_INDUSTRY: ${{ github.event.inputs.target_industry || '不限' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
        run: |
          python scripts/perfpulse_job_analysis.py

      - name: Upload Job Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            jobs_result.json
            jobs_result.md
            boss_debug/
          if-no-files-found: ignore
