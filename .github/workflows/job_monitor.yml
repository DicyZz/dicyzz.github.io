name: Job Monitor - 招聘信息实时抓取

# 手机一键抓取：GitHub App → Actions → 本 workflow → Run workflow（默认值已填好，直接点 Run）。
# 默认跑在 self-hosted runner（这台 Mac）上：只有国内 IP 才能抓到 BOSS 直聘。
# 换机器/首次部署：bash scripts/setup_macmini_runner.sh（含依赖安装 + BOSS 扫码登录）。
on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 页面手动点击触发，可输入目标城市与岗位
  workflow_dispatch:
    inputs:
      target_job:
        description: '目标岗位关键词（如：芯片设计、算法工程师、建模；会自动扩展同义词）'
        required: false
        default: '芯片设计'
      target_city:
        description: '目标城市（如：北京、上海、深圳、杭州、广州；填「全国」则不筛选）'
        required: false
        default: '全国'
      max_pages:
        description: '猎聘抓取页数（1-10，默认3，每页约40条）'
        required: false
        default: '3'
      boss_pages:
        description: 'BOSS 直聘翻页数（1-10，默认1；页数越多越容易触发风控）'
        required: false
        default: '1'
      boss_keywords:
        description: 'BOSS 直聘搜索的关键词个数（默认1，填2-3可扩大覆盖但请求更多）'
        required: false
        default: '1'
      boss_detail:
        description: 'BOSS 直聘抓取详情正文的岗位数（默认0关闭，建议不超过5）'
        required: false
        default: '0'
      boss_headful:
        description: 'BOSS 是否显示浏览器窗口（1 有头更稳，0 无头适合锁屏/无人值守）'
        required: false
        default: '1'
      runner:
        description: '执行环境：默认 self-hosted（这台 Mac，可抓 BOSS）；填 ubuntu-latest 则云端跑但抓不到 BOSS'
        required: false
        default: 'self-hosted'
      target_industry:
        description: '目标行业（默认不限）'
        required: false
        default: '不限'
        type: choice
        options:
          - '不限'
          - '互联网/软件/IT'
          - '半导体/电子/芯片'
          - '人工智能'
          - '金融'
          - '医疗健康'
          - '汽车/新能源'
          - '教育/培训'
          - '游戏'
          - '制造业'
          - '通信'
          - '电商/零售/消费'
          - '企业服务'
          - '广告/营销/传媒'

# 避免定时任务和手动触发重叠（同一账号并发请求更容易触发 BOSS 风控）
concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  analyze-jobs:
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 云端 runner 才需要现装 Python；self-hosted 直接用机器上已装好的 python3
      - name: Set up Python (cloud runner only)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Python Environment
        run: |
          set -euo pipefail
          PY=""
          for candidate in python3 python; do
            if command -v "$candidate" >/dev/null 2>&1; then
              PY="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$PY" ]; then
            echo "::error::没找到 python3，请先在服务器上运行 bash scripts/setup_macmini_runner.sh"
            exit 1
          fi
          echo "PYTHON_BIN=$PY" >> "$GITHUB_ENV"
          echo "使用解释器：$PY（$("$PY" -V 2>&1)）"
          if "$PY" -c "import requests, markdown, premailer, openai, lxml, playwright, yaml" 2>/dev/null; then
            echo "DEPS_READY=1" >> "$GITHUB_ENV"
            echo "✅ Python 依赖已就绪，跳过安装"
          else
            echo "DEPS_READY=0" >> "$GITHUB_ENV"
            echo "ℹ️ 依赖不完整，稍后自动安装"
          fi

      - name: Check BOSS Login State
        if: runner.environment == 'self-hosted'
        run: |
          PROFILE="$HOME/boss_chrome_profile"
          if [ -d "$PROFILE" ]; then
            echo "✅ 找到 BOSS 登录 profile：$PROFILE"
          else
            echo "::warning::未找到 $PROFILE，本次会跳过 BOSS 直聘。请在服务器上运行 python3 scripts/boss_login.py 完成扫码登录。"
          fi

      - name: Install Dependencies
        if: env.DEPS_READY != '1'
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip || true
          "$PYTHON_BIN" -m pip install --user requests markdown premailer openai playwright lxml pyyaml \
            || "$PYTHON_BIN" -m pip install --break-system-packages requests markdown premailer openai playwright lxml pyyaml
          if [ "$(uname)" = "Linux" ]; then
            "$PYTHON_BIN" -m playwright install --with-deps chromium
          else
            "$PYTHON_BIN" -m playwright install chromium
          fi

      - name: Run Unit Tests
        run: |
          "$PYTHON_BIN" -m unittest discover -s tests -v

      - name: Run Job Analysis Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          BOSS_COOKIES: ${{ secrets.BOSS_COOKIES }}
          BOSS_PROXY: ${{ secrets.BOSS_PROXY }}
          BOSS_PROFILE_DIR: ${{ secrets.BOSS_PROFILE_DIR || '' }}
          BOSS_HEADFUL: ${{ github.event.inputs.boss_headful || secrets.BOSS_HEADFUL || '1' }}
          BOSS_PAGES: ${{ github.event.inputs.boss_pages || '1' }}
          BOSS_KEYWORDS_COUNT: ${{ github.event.inputs.boss_keywords || '1' }}
          BOSS_MAX_DETAIL: ${{ github.event.inputs.boss_detail || '0' }}
          BOSS_DEBUG_DIR: boss_debug
          TARGET_CITY: ${{ github.event.inputs.target_city || '全国' }}
          TARGET_JOB: ${{ github.event.inputs.target_job || '芯片设计' }}
          TARGET_INDUSTRY: ${{ github.event.inputs.target_industry || '不限' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
        run: |
          "$PYTHON_BIN" scripts/perfpulse_job_analysis.py

      - name: Upload Job Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            jobs_result.json
            jobs_result.md
            boss_debug/
          if-no-files-found: ignore
