name: 一次性-导出密钥到本机（用完即删）

# 【这是一次性引导任务，用完请删除本文件】
#
# 作用：把仓库 Secrets 里的 DeepSeek / 邮箱配置写入本机 self-hosted runner 用户的
#       ~/.config/briefing-secrets.env（600 权限），供 scripts/local_briefings.sh 使用。
# 只支持手动触发；不会写入仓库目录，也不会打印任何密钥值（GitHub 日志里也会打码）。
#
# 用法：GitHub App → Actions → 本 workflow → Run workflow。
# 运行约 10 秒，跑完后可在本机检查：
#   ls -l ~/.config/briefing-secrets.env
#   bash ~/briefings/scripts/local_briefings.sh     # 手动试跑一次四个周报
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Write secrets to ~/.config/briefing-secrets.env
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          set -euo pipefail
          TARGET_DIR="${HOME}/.config"
          TARGET="${TARGET_DIR}/briefing-secrets.env"
          mkdir -p "${TARGET_DIR}"
          umask 077
          {
            echo "# 由 GitHub Actions 一次性导出（也可用 scripts/setup_local_scheduler.sh 重建模板）"
            echo "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}"
            echo "EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}"
            echo "EMAIL_PORT=${EMAIL_PORT:-465}"
            echo "EMAIL_SENDER=${EMAIL_SENDER:-}"
            echo "EMAIL_PASSWORD=${EMAIL_PASSWORD:-}"
            echo "EMAIL_RECEIVER=${EMAIL_RECEIVER:-${EMAIL_SENDER:-}}"
          } > "${TARGET}"
          chmod 600 "${TARGET}"
          echo "已写入：$(ls -l "${TARGET}")"
          echo "（下面只报告是否写入成功，不显示任何值）"
          for key in DEEPSEEK_API_KEY EMAIL_SENDER EMAIL_PASSWORD; do
            if grep -q "^${key}=.\+" "${TARGET}"; then
              echo "  ✅ ${key} 已写入"
            else
              echo "  ❌ ${key} 是空的（仓库里可能没配置这个 Secret）"
            fi
          done
          echo "接下来可手动试跑：bash ${HOME}/briefings/scripts/local_briefings.sh"
